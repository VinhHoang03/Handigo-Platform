<body class="bg-background text-on-surface antialiased min-h-screen flex justify-center selection:bg-primary-fixed selection:text-primary">
<!-- Mobile Viewport Container (App Shell) -->
<main class="w-full max-w-md bg-surface min-h-screen relative flex flex-col justify-between overflow-x-hidden pb-10">
<!-- Atmospheric Ambient Background Light -->
<div class="pointer-events-none absolute -top-28 -right-28 w-80 h-80 bg-primary-fixed-dim/40 rounded-full blur-3xl"></div>
<div class="pointer-events-none absolute top-96 -left-32 w-72 h-72 bg-secondary-container/30 rounded-full blur-3xl"></div>
<!-- Header Section (Top App Bar & Title) -->
<div class="px-6 pt-6 z-10">
<!-- Top Action Bar -->
<div class="flex items-center justify-between h-12 mb-6">
<button aria-label="Quay lại" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-lowest shadow-sm border border-outline-variant/30 text-on-surface active:scale-95 hover:bg-surface-container transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<!-- Brand Identity Indicator -->
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low border border-outline-variant/20 shadow-sm">
<span class="material-symbols-outlined text-primary text-[18px]">handyman</span>
<span class="font-headline-md text-[16px] font-bold text-primary tracking-tight">Handigo</span>
</div>
<div class="w-10"></div> <!-- Placeholder for visual balance -->
</div>
<!-- Headline & Subtitle -->
<div class="space-y-2 mb-6">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold tracking-tight">
          Tạo tài khoản mới
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-[14px] leading-relaxed">
          Trải nghiệm hơn 30+ dịch vụ sửa chữa và chăm sóc nhà cửa tận nơi
        </p>
</div>
<!-- Registration Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Input: Họ và tên -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold block">Họ và tên</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl border border-outline-variant/40 shadow-sm focus-within:border-primary-container focus-within:ring-2 focus-within:ring-primary-fixed transition-all duration-150">
<span class="material-symbols-outlined text-outline ml-3.5 mr-2">person</span>
<input class="w-full py-3.5 pr-4 bg-transparent border-0 font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:ring-0 text-[15px]" placeholder="Nguyễn Văn A" required="" type="text"/>
</div>
</div>
<!-- Input: Số điện thoại -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold block">Số điện thoại di động</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl border border-outline-variant/40 shadow-sm focus-within:border-primary-container focus-within:ring-2 focus-within:ring-primary-fixed transition-all duration-150">
<span class="material-symbols-outlined text-outline ml-3.5 mr-2">phone</span>
<input class="w-full py-3.5 pr-4 bg-transparent border-0 font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:ring-0 text-[15px]" placeholder="0912 345 678" required="" type="tel"/>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1.5 pt-0.5 text-[12px]">
<span class="material-symbols-outlined text-[15px] text-secondary">info</span>
            Dùng để nhận mã OTP và thợ liên hệ khi đến nhà
          </p>
</div>
<!-- Input: Email -->
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface font-semibold">Địa chỉ Email</label>
<span class="font-label-sm text-label-sm text-outline font-normal">Tùy chọn</span>
</div>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl border border-outline-variant/40 shadow-sm focus-within:border-primary-container focus-within:ring-2 focus-within:ring-primary-fixed transition-all duration-150">
<span class="material-symbols-outlined text-outline ml-3.5 mr-2">mail</span>
<input class="w-full py-3.5 pr-4 bg-transparent border-0 font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:ring-0 text-[15px]" placeholder="ban@vidu.com" type="email"/>
</div>
</div>
<!-- Input: Mật khẩu & Strength Bar -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold block">Mật khẩu</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl border border-outline-variant/40 shadow-sm focus-within:border-primary-container focus-within:ring-2 focus-within:ring-primary-fixed transition-all duration-150">
<span class="material-symbols-outlined text-outline ml-3.5 mr-2">lock</span>
<input class="w-full py-3.5 pr-11 bg-transparent border-0 font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:ring-0 text-[15px]" id="password-input" placeholder="Tối thiểu 8 ký tự, gồm chữ &amp; số" required="" type="password"/>
<button aria-label="Hiện mật khẩu" class="absolute right-3.5 text-outline hover:text-on-surface p-1 flex items-center" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
<!-- Strength Indicator Visual -->
<div class="pt-1.5 space-y-1">
<div class="grid grid-cols-4 gap-1.5 h-1.5">
<div class="h-full rounded-full bg-primary-container transition-all" id="bar-1"></div>
<div class="h-full rounded-full bg-primary-container transition-all" id="bar-2"></div>
<div class="h-full rounded-full bg-primary-container/80 transition-all" id="bar-3"></div>
<div class="h-full rounded-full bg-surface-container-highest transition-all" id="bar-4"></div>
</div>
<div class="flex justify-between items-center text-[12px] font-label-sm text-on-surface-variant">
<span>Độ an toàn: <strong class="text-primary-container font-semibold">Tốt</strong></span>
<span>Gồm chữ &amp; số</span>
</div>
</div>
</div>
<!-- Input: Nhập lại mật khẩu -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold block">Nhập lại mật khẩu</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl border border-outline-variant/40 shadow-sm focus-within:border-primary-container focus-within:ring-2 focus-within:ring-primary-fixed transition-all duration-150">
<span class="material-symbols-outlined text-outline ml-3.5 mr-2">verified_user</span>
<input class="w-full py-3.5 pr-4 bg-transparent border-0 font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:ring-0 text-[15px]" placeholder="Nhập lại mật khẩu vừa đặt" required="" type="password"/>
</div>
</div>
<!-- Checkbox: Terms & Policy -->
<div class="pt-1">
<label class="flex items-start gap-3 cursor-pointer group">
<input checked="" class="mt-1 w-4 h-4 rounded text-primary-container border-outline-variant focus:ring-primary-container" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant text-[13px] leading-relaxed">
              Tôi đồng ý với <a class="text-primary-container font-semibold hover:underline" href="#">Điều khoản dịch vụ</a> và <a class="text-primary-container font-semibold hover:underline" href="#">Chính sách bảo mật</a> của Handigo.
            </span>
</label>
</div>
<!-- Primary CTA Button -->
<div class="pt-3">
<button class="w-full min-h-[50px] bg-primary-container hover:opacity-95 text-on-primary font-headline-md text-[16px] font-semibold rounded-xl shadow-md flex items-center justify-center gap-2 active:scale-95 transition-all duration-150" type="submit">
<span>Tiếp tục / Đăng ký</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Social Divider -->
<div class="relative my-6 text-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center">
<span class="px-3 bg-surface font-label-sm text-label-sm text-outline">Hoặc đăng ký nhanh bằng</span>
</div>
</div>
<!-- Social Login Buttons -->
<div class="grid grid-cols-2 gap-3">
<!-- Google Button -->
<button class="flex items-center justify-center gap-2.5 min-h-[46px] px-4 py-2.5 bg-surface-container-lowest border border-outline-variant/40 rounded-xl shadow-sm hover:bg-surface-container-low active:scale-95 transition-all duration-150" type="button">
<svg class="w-5 h-5 flex-shrink-0" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface font-semibold text-[14px]">Google</span>
</button>
<!-- Apple Button -->
<button class="flex items-center justify-center gap-2.5 min-h-[46px] px-4 py-2.5 bg-surface-container-lowest border border-outline-variant/40 rounded-xl shadow-sm hover:bg-surface-container-low active:scale-95 transition-all duration-150" type="button">
<svg class="w-5 h-5 flex-shrink-0 fill-on-surface" viewbox="0 0 170 170">
<path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.04-7.66-7.85-11.91-14.42-6.53-10.12-11.45-21.78-14.75-34.97-3.3-13.18-4.95-25.04-4.95-35.59 0-14.58 3.69-26.79 11.07-36.63 7.38-9.84 16.71-14.88 27.99-15.12 4.35 0 9.27 1.13 14.75 3.39 5.48 2.27 9.4 3.45 11.75 3.55 2.12 0 6.23-1.28 12.32-3.83 6.09-2.55 11.36-3.69 15.82-3.41 12.06.82 21.6 5.14 28.61 12.98-10.74 6.5-16 15.48-15.78 26.93.22 9.07 3.73 16.71 10.53 22.91 6.8 6.2 14.88 9.77 24.23 10.71-2.02 6.09-4.58 12.2-7.69 18.33zM119.22 33.15c0-7.25 2.59-14.15 7.76-20.71 5.18-6.55 11.66-10.7 19.46-12.44.82 2.28 1.23 4.68 1.23 7.21 0 7.37-2.67 14.4-8.02 21.09-5.35 6.69-11.93 10.78-19.74 12.28-.27-2.45-.69-4.93-.69-7.43z"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface font-semibold text-[14px]">Apple</span>
</button>
</div>
</div>
<!-- Bottom Destination Prompt: Đã có tài khoản? -->
<div class="pt-8 px-6 text-center z-10">
<p class="font-body-md text-body-md text-on-surface-variant text-[14px]">
        Đã có tài khoản? 
        <a class="text-primary font-bold hover:underline transition-colors ml-1" href="#">
          Đăng nhập ngay
        </a>
</p>
</div>
</main>
<!-- Interactive script for password toggle and strength demo -->
<script>
    const passwordInput = document.getElementById('password-input');
    const togglePassword = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
    });
  </script>
</body></html>
